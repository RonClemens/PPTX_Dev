services:
  - type: web
    name: pptx-review-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # persistent disks require a paid plan; the free plan's
                  # filesystem is ephemeral and would lose all documents on
                  # every deploy/restart
    envVars:
      # No ANTHROPIC_API_KEY/ANTHROPIC_BASE_URL here on purpose: this
      # deployment never bakes in an AI credential. Each user enters their own
      # key/token and base URL in the in-app Settings modal; those stay in the
      # user's browser and are sent only with AI requests -- the server stores
      # nothing. (Setting ANTHROPIC_API_KEY etc. in the Render dashboard would
      # instead create a shared, server-held key.)
      - key: PPTX_DEV_AI_MODEL
        value: claude-sonnet-5
      - key: PPTX_DEV_DATA_DIR
        value: /data
    disk:
      name: pptx-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
